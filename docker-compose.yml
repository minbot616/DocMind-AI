version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: docmind-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docmind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: docmind-app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/docmind_db
      - JWT_SECRET_KEY=docmind_prod_secret_key_892103812
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
